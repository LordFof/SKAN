name: Build SKAN APK

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SKAN project
        run: unzip -o SKAN.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/skan-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/skan-signing/skan-release.jks"

      - name: Build APK
        working-directory: SKAN
        run: gradle assembleDebug --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(find "$SDK/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)

          INPUT="SKAN/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="$RUNNER_TEMP/SKAN-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/skan-signing/skan-release.jks"

          "$BUILD_TOOLS/zipalign" -f 4 "$INPUT" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out SKAN.apk \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose SKAN.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SKAN-signed
          path: SKAN.apk
          if-no-files-found: error
